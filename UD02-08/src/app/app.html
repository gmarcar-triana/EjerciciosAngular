<div class="container py-4">
  <h1 class="mb-4">Barra de progreso personalizable</h1>
  <hr>
  <h2 class="h5">Configurador</h2>
  <div class="row g-3 mb-3">
    <div class="col-md-4">
      <label class="form-label" for="valor">Valor: {{ valor }}</label>
      <input id="valor" type="range" class="form-range" min="0" max="100" [(ngModel)]="valor">
    </div>
    <div class="col-md-4">
      <label class="form-label" for="color">Color</label>
      <select id="color" class="form-select" [(ngModel)]="color">
        @for (c of colores; track c) {
          <option [value]="c">{{ c }}</option>
        }
      </select>
    </div>
    <div class="col-md-4 d-flex flex-column justify-content-end">
      <div class="form-check"><input id="striped" class="form-check-input" type="checkbox" [(ngModel)]="striped"><label class="form-check-label" for="striped">Rayada</label></div>
      <div class="form-check"><input id="label" class="form-check-input" type="checkbox" [(ngModel)]="showLabel"><label class="form-check-label" for="label">Mostrar porcentaje</label></div>
    </div>
  </div>
  <app-custom-progress-bar [value]="valor" [color]="color" [striped]="striped" [showLabel]="showLabel" [height]="30" />
</div>
