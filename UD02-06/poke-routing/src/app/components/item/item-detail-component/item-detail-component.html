<div class="container my-4">
    <a routerLink="/items" class="btn btn-outline-secondary mb-3">&larr; Volver al listado</a>
    @if (item(); as item) {
        <div class="card shadow-sm">
            <div class="row g-0 align-items-center">
                <div class="col-md-4 text-center p-3">
                    <img [src]="`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/${item.name}.png`" class="img-fluid" style="max-height: 280px" [alt]="item.name">
                </div>
                <div class="col-md-8">
                    <div class="card-body">
                        <h2 class="card-title text-capitalize">{{ item.name }}</h2>
            <p class="mb-1"><strong>ID:</strong> {{ item.id }}</p>
            <p class="mb-1"><strong>Categoría:</strong> <span class="text-capitalize">{{ item.category.name }}</span></p>
            <p class="mb-1"><strong>Coste:</strong> {{ item.cost }}</p>
            <p class="mb-1"><strong>Atributos:</strong>
                @for (a of item.attributes; track a.name) {
                    <span class="badge bg-secondary me-1">{{ a.name }}</span>
                }
            </p>
            @if (englishEffect(); as effect) {
                <p class="mt-3">{{ effect }}</p>
            }
                    </div>
                </div>
            </div>
        </div>
    } @else {
        <p class="text-center">Cargando...</p>
    }
</div>
