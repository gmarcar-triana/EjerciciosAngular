<div class="container mt-5 d-flex justify-content-center">
  <div class="card shadow-lg border-0 rounded-4 p-3" style="width: 320px; background-color: #212529;">
    
    <div class="card-body bg-dark text-end rounded-3 mb-3 p-3 text-white border border-secondary">
      <small class="text-secondary d-block min-vh-1" style="font-size: 0.85rem;">
        {{ operacion ? numero1 + ' ' + operacion : '&nbsp;' }}
      </small>
      <div class="fs-1 fw-bold text-success font-monospace text-truncate">
        {{ pantalla }}
      </div>
    </div>

    <div class="row g-2 text-center">
      <div class="col-4"><button (click)="agregarNumero('7')" class="btn btn-outline-light w-100 fs-4 py-3">7</button></div>
      <div class="col-4"><button (click)="agregarNumero('8')" class="btn btn-outline-light w-100 fs-4 py-3">8</button></div>
      <div class="col-4"><button (click)="agregarNumero('9')" class="btn btn-outline-light w-100 fs-4 py-3">9</button></div>

      <div class="col-4"><button (click)="agregarNumero('4')" class="btn btn-outline-light w-100 fs-4 py-3">4</button></div>
      <div class="col-4"><button (click)="agregarNumero('5')" class="btn btn-outline-light w-100 fs-4 py-3">5</button></div>
      <div class="col-4"><button (click)="agregarNumero('6')" class="btn btn-outline-light w-100 fs-4 py-3">6</button></div>

      <div class="col-4"><button (click)="agregarNumero('1')" class="btn btn-outline-light w-100 fs-4 py-3">1</button></div>
      <div class="col-4"><button (click)="agregarNumero('2')" class="btn btn-outline-light w-100 fs-4 py-3">2</button></div>
      <div class="col-4"><button (click)="agregarNumero('3')" class="btn btn-outline-light w-100 fs-4 py-3">3</button></div>

      <div class="col-4"><button (click)="agregarNumero('0')" class="btn btn-outline-light w-100 fs-4 py-3">0</button></div>
      <div class="col-4"><button (click)="limpiar()" class="btn btn-danger w-100 fs-5 py-3 fw-bold">C</button></div>
      <div class="col-4">
        <button (click)="calcular()" [disabled]="operacion === ''" class="btn btn-success w-100 fs-4 py-3 fw-bold">=</button>
      </div>

      <div class="col-6"><button (click)="setOperacion('+')" class="btn btn-warning w-100 fs-3 py-2 fw-bold">+</button></div>
      <div class="col-6"><button (click)="setOperacion('-')" class="btn btn-warning w-100 fs-3 py-2 fw-bold">-</button></div>
    </div>

  </div>
</div>
